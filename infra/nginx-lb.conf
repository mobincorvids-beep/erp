# Local demonstration of the same shape a real load balancer (an ALB, GCP
# Load Balancer, or a shared ingress-nginx in k8s) plays in front of this
# API in production. `api` here resolves via Docker Compose's embedded DNS
# to every healthy replica of the `api` service — round-robin across
# however many you start with `docker compose up --scale api=3`, which is
# the whole point: the API tier is stateless (JWT auth, no server-side
# session, no local file storage — see server.js's graceful shutdown and
# the JWT/RefreshToken design), so adding replicas is genuinely just
# adding capacity, not a bigger architectural change.
upstream erp_api {
    # least_conn, not the default round-robin: some requests (a large
    # report export, a big GRN with many serials) run far longer than a
    # typical POS checkout — routing new requests to whichever replica has
    # the fewest in-flight requests avoids piling load onto one replica
    # that happens to be mid-export while others sit idle.
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://erp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matches server.js's `app.set('trust proxy', 1)` — rate limiting
        # and audit logging key off the real client IP this header carries,
        # not this proxy's own IP.

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /readyz {
        # Exposed directly (not load-balanced to "a" replica) so an
        # external monitor can distinguish "the LB itself is up" from "at
        # least one backend is ready" — proxy_pass below still goes through
        # the same upstream, this location just documents the intent.
        proxy_pass http://erp_api/readyz;
    }
}
