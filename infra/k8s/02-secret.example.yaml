# Template, not a real Secret — copy to 02-secret.yaml (already
# .gitignore'd — see infra/k8s/.gitignore), fill in real values, and
# `kubectl apply -f` that instead. Never commit real credentials.
#
# In a production cluster, prefer sourcing these from your cloud's real
# secret manager (AWS Secrets Manager, GCP Secret Manager, Vault) via the
# External Secrets Operator rather than a plain Kubernetes Secret at rest
# — plain Secrets are only base64-encoded, not encrypted, unless the
# cluster has encryption-at-rest and RBAC locked down deliberately.
apiVersion: v1
kind: Secret
metadata:
  name: erp-api-secrets
  namespace: erp
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_generate_with_crypto_randomBytes_32"
  # A managed MongoDB (Atlas, DocumentDB, a MongoDB-Operator-managed
  # replica set) connection string with `secondaryPreferred` read routing
  # honored via MONGO_READ_PREFERENCE above — see infra/k8s/README.md for
  # why this platform should not run its own unmanaged single-node Mongo
  # in production.
  MONGO_URI: "mongodb+srv://REPLACE_ME"
  REDIS_URL: "redis://REPLACE_ME:6379"
  FBR_API_TOKEN: "REPLACE_ME_if_registered"
