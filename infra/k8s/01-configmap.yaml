# Non-secret configuration. Real credentials (JWT_SECRET, MONGO_URI,
# REDIS_URL if it carries a password) belong in a Secret — see
# 02-secret.example.yaml — never here, since ConfigMaps are plain text and
# commonly readable by far more of the cluster than Secrets are.
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-api-config
  namespace: erp
data:
  PORT: "4000"
  JWT_EXPIRES_IN: "1h"
  LOG_LEVEL: "info"
  WORKER_CONCURRENCY: "10"
  # Tuned per replica, not globally — see the comment in src/config/db.js.
  # 30 x up to ~50 HPA-scaled api replicas = a ceiling of ~1,500 connections
  # against the Mongo cluster; size the cluster's own connection limit and
  # this number together, don't set this in isolation.
  MONGO_MAX_POOL_SIZE: "30"
  MONGO_READ_PREFERENCE: "secondaryPreferred"
  # Real production origin(s) for the deployed client — replace before
  # applying, the compose/local default below is a placeholder.
  CLIENT_ORIGIN: "https://app.example.com"
  # Only turn this on once the worker Deployment (04-worker.yaml) is
  # actually running — see the caution in posSaleService.js next to this
  # flag before flipping it.
  WEBHOOK_ASYNC: "true"
