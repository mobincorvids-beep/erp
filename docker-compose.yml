# NOTE: same caveat as both Dockerfiles — written to standard
# docker-compose conventions but never actually run in this sandbox (no
# Docker daemon, registry blocked by the network allowlist). Run
# `docker compose up --build` locally to verify before relying on it, and
# change JWT_SECRET and the Mongo/Redis credentials below before using this
# anywhere beyond your own machine — the values here are placeholders, not
# secrets safe to commit to a real repo.
#
# Horizontal scale-out, demonstrated locally:
#   docker compose up --build --scale api=3 --scale worker=2
# `api` has no published host port anymore (see below) — `lb` is the one
# thing bound to the host, round-robining across every `api` replica via
# Docker's embedded DNS (see infra/nginx-lb.conf). Job processing (webhook
# delivery, document-expiry/FBR sweeps — src/queue/) scales independently
# via `worker` replicas, since it's a separate process pulling from the
# same Redis-backed queue, not tied to request traffic at all.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: pos_erp
      MONGO_INITDB_ROOT_PASSWORD: change_this_password
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Optional for a single `api` replica (everything degrades to
    # in-process behavior without it — see src/config/redis.js) but
    # required the moment you scale `api` or `worker` beyond one instance,
    # since that's what makes rate limiting, caching, and the job queue
    # correct/durable across replicas instead of each having its own.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      MONGO_URI: mongodb://pos_erp:change_this_password@mongo:27017/pos_erp?authSource=admin
      MONGO_MAX_POOL_SIZE: 50 # per replica — tune down from the 100 default once you're actually running several replicas against one Mongo cluster, see src/config/db.js
      REDIS_URL: redis://redis:6379
      WEBHOOK_ASYNC: "true" # safe here specifically because `worker` is guaranteed running alongside it in this compose file — see the comment on this flag in posSaleService.js before enabling it anywhere `worker` might not be
      JWT_SECRET: change_this_to_a_real_random_secret_before_deploying
      JWT_EXPIRES_IN: 1h
      CLIENT_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
    # No `ports:` here on purpose — with more than one replica, several
    # containers can't all bind host port 4000. `lb` is the one thing
    # exposed to the host; reach the API through it.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://pos_erp:change_this_password@mongo:27017/pos_erp?authSource=admin
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: 10
      JWT_SECRET: change_this_to_a_real_random_secret_before_deploying
      LOG_LEVEL: info

  lb:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./infra/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4000:80" # the client's VITE_API_BASE_URL (http://localhost:4000/api/v1) now reaches the LB, not one specific api container

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - lb
    ports:
      - "5173:80"

volumes:
  mongo-data:
  redis-data:
